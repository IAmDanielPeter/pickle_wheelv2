<!DOCTYPE html>
<html>

<head>
    <title>Pickle's Wheel</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"
        integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
    <script src="assets/js/main.js" type="text/javascript"></script>
    <link href="assets/css/style.css" rel="stylesheet" type="text/css" />
</head>

<body class="index">
    <div id="container">
        <div class="top">
            <h1>Pickle's Wheel Support</h1>
            <div class="wheel-display">
                <img id="wheel" src="assets/images/wheel.png">
                <span id="throttle" class="pedal"><span></span></span>
                <span id="brake" class="pedal"><span></span></span>
                <span id="clutch" class="pedal"><span></span></span>
                <div class="transmission-toggle">
                    <label class="switch">
                        <input type="checkbox" id="manual-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">Manual</span>
                </div>
            </div>
            <div id="close">x</div>
        </div>
        <div class="middle">
        </div>
        <div class="bottom">
            <div id="save-button" class="button success">SAVE SETTINGS</div>
        </div>
    </div>

    <!-- Cyberpunk Gear Indicator -->
    <div id="gear-indicator" class="cyberpunk-indicator">
        <div class="indicator-border">
            <div class="indicator-content">
                <div class="gear-label">GEAR</div>
                <div class="gear-value">N</div>
                <div class="rpm-meter-container">
                    <div class="rpm-label">RPM</div>
                    <div class="rpm-meter">
                        <div class="rpm-bar"></div>
                    </div>
                    <div class="rpm-value">0</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
